name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Un tag v12.51 publicado con un APK 12.50 deja a todos los usuarios
      # en un bucle de "actualización disponible". La versión del build debe
      # ser exactamente el tag y el versionCode su esquema major*1000+minor.
      - name: Verify build version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n1)
          CODE=$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n1)
          MAJOR="${TAG%%.*}"
          REST="${TAG#*.}"
          MINOR="${REST%%.*}"
          EXPECTED=$((MAJOR * 1000 + MINOR))
          echo "tag=$TAG versionName=$NAME versionCode=$CODE esperado=$EXPECTED"
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::El tag v$TAG no coincide con versionName \"$NAME\" de app/build.gradle"
            exit 1
          fi
          if [ "$CODE" != "$EXPECTED" ]; then
            echo "::error::versionCode $CODE no coincide con $TAG (esperado $EXPECTED)"
            exit 1
          fi

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Verificación sobre el APK real, no solo sobre el archivo Gradle: si
      # AGP ignorara versionCode/versionName, el release no se publica.
      - name: Verify APK version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n1)
          BADGING=$("$AAPT2" dump badging app/build/outputs/apk/release/app-universal-release.apk | head -n1)
          NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          echo "tag=$TAG apkVersionName=$NAME apkVersionCode=$CODE"
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::El APK se compiló como $NAME y el tag es v$TAG"
            exit 1
          fi
          EXPECTED=$(echo "$TAG" | awk -F. '{print $1 * 1000 + $2}')
          if [ "$CODE" != "$EXPECTED" ]; then
            echo "::error::El APK tiene versionCode $CODE y el tag v$TAG exige $EXPECTED"
            exit 1
          fi

      - name: Generate SHA-256 checksums
        working-directory: app/build/outputs/apk/release
        # La app verifica este archivo antes de instalar; el formato es el
        # que consume ApkVerification.parseChecksums (`<hex>  <archivo>`).
        run: |
          sha256sum app-universal-release.apk \
                    app-arm64-v8a-release.apk \
                    app-armeabi-v7a-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            app/build/outputs/apk/release/app-universal-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
          overwrite_files: true
          draft: false
          prerelease: false